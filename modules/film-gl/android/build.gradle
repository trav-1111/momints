plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.momints'
version = '1.0.0'

android {
  namespace "expo.modules.filmgl"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
