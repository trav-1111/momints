# Inactive old-service configuration retained only for rollback.
# It deliberately exposes no workers.dev, preview, custom-domain, consumer or
# Cron execution path. Rollback must first pause the promoted service, verify
# schema compatibility, then deliberately restore exactly one authoritative
# set of routes/consumers/schedules using the runbook.
name = "momints-roll-worker"
main = "src/index.ts"
compatibility_date = "2026-07-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
DEPLOYMENT_ENV = "retired-production"
MAINTENANCE_MODE = "true"
QUICK_PLACEHOLDER_URI = "https://arweave.net/JbRjC4JbM7jbNRyiEZO7gj43gbOWBqt-O5RD4oZmCcw"
QUICK_TREASURY_ADDRESS = "o4w1THGTu1ufcRUEpVn45zttpcPoQBFFSLtMYeu5HpW"

[[d1_databases]]
binding = "DB"
database_name = "momints-rolls"
database_id = "c4897487-5eef-4569-87a4-14306d4eac72"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "QUICK_STAGING"
bucket_name = "momints-quick-staging"

[[r2_buckets]]
binding = "FILMSTOCK_ASSETS"
bucket_name = "momints-filmstocks"

[[ratelimits]]
name = "FILMSTOCK_UNLOCK_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "ROLL_MUTATION_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "QUICK_MINT_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[[rules]]
type = "Data"
globs = ["**/*.jpg"]
fallthrough = true
