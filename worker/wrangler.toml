# Momints roll backend — single Worker, validated by the bundle spike:
# Irys + mpl-core + photon fit in one Worker with ~41% Free-tier headroom
# (worker-irys-spike/RESULT2.md). Do NOT split into multiple Workers.
name = "momints-roll-worker"
main = "src/index.ts"
compatibility_date = "2026-07-22"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put <NAME>` — wrangler deploy does NOT read
# .dev.vars; .dev.vars is local-dev only and gitignored):
#   IRYS_FUNDING_KEY   base58 secret key of the DEVNET funding wallet. Also the
#                      Worker's on-chain payer/authority for collection creation
#                      and frame mints. Never generated, printed, or logged.
#   SOLANA_RPC_URL     Helius devnet endpoint. REQUIRED — the public
#                      api.devnet.solana.com blocks Workers' egress IPs for
#                      transaction sends. No public fallback exists in code.
#   DISCORD_WEBHOOK_URL  Channel webhook for treasury-monitor alerts. Optional:
#                      without it the monitor still runs and logs, it just
#                      cannot notify. A secret — never in this file.
#   OPERATOR_DISCORD_ID  Operator's Discord user ID, @-mentioned on CRITICAL
#                      alerts only. Low sensitivity, but kept a secret for
#                      consistency; critical alerts still post without it.

# Treasury monitor (src/ops/monitor.ts): reads the Irys balance and posts a
# Discord alert when the funding severity level CHANGES. READ-ONLY — it never
# funds, signs, or moves anything. Cadence is a floor on how late an alert can
# be: at 6h the operator hears about a crossing within 6 hours of it happening,
# which the generous roll-headroom thresholds are sized around.
# TODO tune cadence alongside ALERT_THRESHOLD_* in src/ops/monitor.ts.
[triggers]
crons = ["0 */6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "momints-rolls"
database_id = "c4897487-5eef-4569-87a4-14306d4eac72"
migrations_dir = "migrations"

# Bundle the base cover artwork (JPEG) as raw bytes.
[[rules]]
type = "Data"
globs = ["**/*.jpg"]
fallthrough = true
