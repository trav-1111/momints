# Momints roll backend — single Worker, validated by the bundle spike:
# Turbo (lean @dha-team/arbundles) + mpl-core + photon fit in one Worker,
# smaller than the old Irys-based bundle (docs/spikes/irys/RESULT2.md,
# ARWEAVE_PATH_OPTIONS.md, worker-turbo-spike/RESULT.md). Do NOT split into
# multiple Workers.
#
# PLAN: Workers PAID. Required by the quick-mint finalize queue (Queues is not
# on the Free plan) and by R2. The old "~41% Free-tier headroom" bundle
# constraint no longer applies — the cap moved from 3 MiB to 10 MiB — but the
# single-Worker decision stands on its own merits.
name = "momints-roll-worker"
main = "src/index.ts"
compatibility_date = "2026-07-22"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put <NAME>` — wrangler deploy does NOT read
# .dev.vars; .dev.vars is local-dev only and gitignored):
#   IRYS_FUNDING_KEY   base58 secret key of the DEVNET funding wallet. Triple
#                      duty: the Worker's on-chain payer/authority for
#                      collection creation and frame mints, AND the SolanaSigner
#                      key that signs every Turbo/Arweave upload. Name kept for
#                      continuity with the deployed secret — it is no longer
#                      Irys-specific. Never generated, printed, or logged.
#   SOLANA_RPC_URL     Helius devnet endpoint. REQUIRED — the public
#                      api.devnet.solana.com blocks Workers' egress IPs for
#                      transaction sends. No public fallback exists in code.
#   DISCORD_WEBHOOK_URL  Channel webhook for treasury-monitor alerts. Optional:
#                      without it the monitor still runs and logs, it just
#                      cannot notify. A secret — never in this file.
#   OPERATOR_DISCORD_ID  Operator's Discord user ID, @-mentioned on CRITICAL
#                      alerts only. Low sensitivity, but kept a secret for
#                      consistency; critical alerts still post without it.
#   OPS_AUTH_TOKEN     Bearer token gating GET /ops/status and GET
#                      /ops/test-alert (funding-wallet internals + a Discord
#                      post trigger — not for a public URL). Both routes 401
#                      if this is unset. Any random string works, e.g.
#                      `openssl rand -hex 32`.

# Treasury monitor (src/ops/monitor.ts): reads the Turbo credit balance and
# posts a Discord alert when the funding severity level CHANGES. READ-ONLY —
# it never funds, signs, or moves anything. Cadence is a floor on how late an
# alert can be: at 6h the operator hears about a crossing within 6 hours of it
# happening, which the generous roll-headroom thresholds are sized around.
# TODO tune cadence alongside ALERT_THRESHOLD_* in src/ops/monitor.ts.
[triggers]
crons = ["0 */6 * * *"]

[vars]
# Static "developing" metadata every quick mint is minted against before its
# real image exists. Uploaded ONCE by scripts/upload-placeholder.mjs — permanent
# and reused forever, so this only changes if the holding artwork changes.
# Genuine Arweave via Turbo (re-uploaded during the Irys -> Turbo swap; the old
# gateway.irys.xyz placeholder is retired). verify.ts compares against
# whatever this var holds, so nothing else needs to change when it's updated.
QUICK_PLACEHOLDER_URI = "https://arweave.net/JbRjC4JbM7jbNRyiEZO7gj43gbOWBqt-O5RD4oZmCcw"
# Receives quick-mint fees. MUST match the app's EXPO_PUBLIC_ROLL_TREASURY:
# the Worker verifies payment to this exact address out of the landed
# transaction, so a mismatch rejects finalizes the user has already paid for.
QUICK_TREASURY_ADDRESS = "o4w1THGTu1ufcRUEpVn45zttpcPoQBFFSLtMYeu5HpW"

[[d1_databases]]
binding = "DB"
database_name = "momints-rolls"
database_id = "c4897487-5eef-4569-87a4-14306d4eac72"
migrations_dir = "migrations"

# Staged quick-mint images, held between the stage request and a verified fee.
# Nothing here has been paid for yet, so the bucket needs a lifecycle rule to
# reap abandoned stages (operator, one-time):
#   wrangler r2 bucket lifecycle add momints-quick-staging \
#     --name expire-staging --prefix quick-staging/ --expire-days 1
[[r2_buckets]]
binding = "QUICK_STAGING"
bucket_name = "momints-quick-staging"

# Finalize jobs, enqueued only after a fee-paying mint is VERIFIED on-chain.
[[queues.producers]]
binding = "QUICK_FINALIZE"
queue = "momints-quick-finalize"

# max_batch_size = 1: every message does an Arweave upload plus an on-chain
# transaction. Batching would put unrelated paid mints behind one another's
# failures and risk the consumer's wall-clock budget.
[[queues.consumers]]
queue = "momints-quick-finalize"
max_batch_size = 1
max_retries = 5
dead_letter_queue = "momints-quick-finalize-dlq"

# The DLQ is consumed by the same Worker (discriminated on batch.queue) purely
# to alert: a dead-lettered message is a PAID mint stuck on the placeholder.
[[queues.consumers]]
queue = "momints-quick-finalize-dlq"
max_batch_size = 10

# Bundle the base cover artwork (JPEG) as raw bytes.
[[rules]]
type = "Data"
globs = ["**/*.jpg"]
fallthrough = true
