# Authoritative production configuration for the promoted Worker.
#
# This checked-in default is intentionally PAUSED. It binds the preserved
# production data/storage but has no Queue consumers, Queue producer or Cron
# triggers. MAINTENANCE_MODE is the code-level backstop that rejects mint and
# payment-processing mutations even when valid production secrets are present.
# Use wrangler.production-active.toml only after the owner has entered the
# existing credentials and the Phase 3 checks have passed.
name = "momints-roll-worker-staging"
main = "src/index.ts"
compatibility_date = "2026-07-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.momints.xyz", custom_domain = true }]

[vars]
DEPLOYMENT_ENV = "production"
MAINTENANCE_MODE = "true"
QUICK_PLACEHOLDER_URI = "https://arweave.net/JbRjC4JbM7jbNRyiEZO7gj43gbOWBqt-O5RD4oZmCcw"
QUICK_TREASURY_ADDRESS = "o4w1THGTu1ufcRUEpVn45zttpcPoQBFFSLtMYeu5HpW"

[[d1_databases]]
binding = "DB"
database_name = "momints-rolls"
database_id = "c4897487-5eef-4569-87a4-14306d4eac72"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "QUICK_STAGING"
bucket_name = "momints-quick-staging"

[[r2_buckets]]
binding = "FILMSTOCK_ASSETS"
bucket_name = "momints-filmstocks"

[[ratelimits]]
name = "FILMSTOCK_UNLOCK_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "ROLL_MUTATION_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "QUICK_MINT_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[[rules]]
type = "Data"
globs = ["**/*.jpg"]
fallthrough = true
