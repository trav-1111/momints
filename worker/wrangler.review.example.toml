# Template ONLY. Copy to ignored wrangler.review.local.toml and replace ALL
# REPLACE_* fields with YOUR resources. No Momints resource IDs are included.
name = "REPLACE_UNIQUE_WORKER_NAME"
account_id = "REPLACE_YOUR_ACCOUNT_ID"
main = "src/index.ts"
compatibility_date = "2026-07-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[vars]
DEPLOYMENT_ENV = "reviewer"
MAINTENANCE_MODE = "true"
STORAGE_PROVIDER = "turbo"
QUICK_PLACEHOLDER_URI = "https://arweave.net/JbRjC4JbM7jbNRyiEZO7gj43gbOWBqt-O5RD4oZmCcw"
QUICK_TREASURY_ADDRESS = "REPLACE_YOUR_TREASURY_PUBLIC_ADDRESS"

[[d1_databases]]
binding = "DB"
database_name = "REPLACE_YOUR_DB_NAME"
database_id = "REPLACE_YOUR_DB_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "QUICK_STAGING"
bucket_name = "REPLACE_YOUR_QUICK_BUCKET"

[[r2_buckets]]
binding = "FILMSTOCK_ASSETS"
bucket_name = "REPLACE_YOUR_FILM_BUCKET"

# Uncomment all three blocks only when deliberately enabling YOUR background
# processing. Leave disabled for maintenance/read-only setup. DLQ ends in -dlq.
# [[queues.producers]]
# binding = "QUICK_FINALIZE"
# queue = "REPLACE_YOUR_FINALIZE_QUEUE"
# [[queues.consumers]]
# queue = "REPLACE_YOUR_FINALIZE_QUEUE"
# max_batch_size = 1
# max_retries = 10
# dead_letter_queue = "REPLACE_YOUR_FINALIZE_QUEUE-dlq"
# [[queues.consumers]]
# queue = "REPLACE_YOUR_FINALIZE_QUEUE-dlq"
# max_batch_size = 1

[[ratelimits]]
name = "FILMSTOCK_UNLOCK_LIMITER"
namespace_id = "REPLACE_YOUR_SEPARATE_NUMERIC_NAMESPACE_1"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "ROLL_MUTATION_LIMITER"
namespace_id = "REPLACE_YOUR_SEPARATE_NUMERIC_NAMESPACE_2"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "QUICK_MINT_LIMITER"
namespace_id = "REPLACE_YOUR_SEPARATE_NUMERIC_NAMESPACE_3"
simple = { limit = 20, period = 60 }

[[rules]]
type = "Data"
globs = ["**/*.jpg"]
fallthrough = true
