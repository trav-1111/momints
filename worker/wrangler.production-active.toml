# Phase 3 activation configuration for momints-roll-worker-staging.
# DO NOT deploy until the owner has replaced the staging signing/operator
# secrets and the production signer, RPC, treasury and balances are verified.
# This is the only config that attaches production consumers and schedules.
name = "momints-roll-worker-staging"
main = "src/index.ts"
compatibility_date = "2026-07-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.momints.xyz", custom_domain = true }]

[triggers]
crons = ["0 */6 * * *", "0 */3 * * *"]

[vars]
DEPLOYMENT_ENV = "production"
MAINTENANCE_MODE = "false"
QUICK_PLACEHOLDER_URI = "https://arweave.net/JbRjC4JbM7jbNRyiEZO7gj43gbOWBqt-O5RD4oZmCcw"
QUICK_TREASURY_ADDRESS = "o4w1THGTu1ufcRUEpVn45zttpcPoQBFFSLtMYeu5HpW"

[[d1_databases]]
binding = "DB"
database_name = "momints-rolls"
database_id = "c4897487-5eef-4569-87a4-14306d4eac72"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "QUICK_STAGING"
bucket_name = "momints-quick-staging"

[[r2_buckets]]
binding = "FILMSTOCK_ASSETS"
bucket_name = "momints-filmstocks"

[[ratelimits]]
name = "FILMSTOCK_UNLOCK_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "ROLL_MUTATION_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "QUICK_MINT_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[[queues.producers]]
binding = "QUICK_FINALIZE"
queue = "momints-quick-finalize"

[[queues.consumers]]
queue = "momints-quick-finalize"
max_batch_size = 1
max_retries = 5
dead_letter_queue = "momints-quick-finalize-dlq"

[[queues.consumers]]
queue = "momints-quick-finalize-dlq"
max_batch_size = 10

[[rules]]
type = "Data"
globs = ["**/*.jpg"]
fallthrough = true
